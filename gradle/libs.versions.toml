# Single source of truth for OPENOP build versions.
# All versions are latest stable as checked on 2026-11-16 (re-checked 2026-11-19)
# (Google Maven, Maven Central, Gradle Plugin Portal). Bump deliberately.

[versions]
agp = "9.5.1"
kotlin = "2.4.21"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
core-ktx = "1.19.1"
# Applied as a constraint to every Compose module so all modules use one lifecycle
# version. Without it, library modules resolve lifecycle 2.9.x, whose bundled lint
# checks AGP 9.5 lint rejects (ObsoleteLintCustomCheck).
lifecycle = "2.11.0"
junit4 = "4.13.2"
androidx-test-ext-junit = "1.3.0"
androidx-test-runner = "1.7.0"
# Pinned: Compose UI Test pulls in espresso-core 3.5.0, which fails on API 37
# (NoSuchMethodException: InputManager.getInstance).
espresso = "3.7.0"
ktlint-gradle = "14.2.0"
ktlint-engine = "1.8.0"
jna = "5.19.1"
navigation3 = "1.2.1"

# Android SDK levels
min-sdk = "31"
compile-sdk = "37"
target-sdk = "37"
ndk = "30.0.16248370"
# Build tool (installed with `cargo install`), read by CI and docs.
cargo-ndk = "4.1.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-test-junit4-accessibility = { module = "androidx.compose.ui:ui-test-junit4-accessibility" }
compose-material3-adaptive-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }

# Gradle plugins used by build-logic convention plugins (compileOnly there;
# the versions are applied through the root build's plugins block).
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ktlint-gradlePlugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
